# The agentic-sdlc checks report in 1 job. The required verify gate stays separate.
name: agentic-sdlc-checks

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: agentic-sdlc-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: cdowin/agentic-sdlc/checks@v4.9.0
        with:
          checks: context-budget test-budget issue-link
