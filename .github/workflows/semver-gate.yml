# GENERATED by agentic-sdlc — `agentic-sdlc install-ci`.
#
# Every merge to the mainline bumps the version: the PR's version (read out of
# VERSION_FILE) must be strictly greater than main's, and must be the version
# (or id) of a `done` milestone under PM_ROADMAP, main's version plus one
# APPENDED hotfix component (0.28.4 -> 0.28.4.1), or — where main is already
# such a hotfix of a done milestone's version, and is not itself one — main with
# its final component INCREMENTED (0.28.4.1 -> 0.28.4.2). Versions of any length compare
# component-wise; the first versioned merge (no version on main yet) is
# allowed with a warning.
# After this file is written it is YOURS: edit it here; re-installing needs
# --force, and `--diff` shows what a re-install would change.
name: Semver Gate

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

# --- project config ----------------------------------------------------------
# `install-ci` renders both lines below from `[pm] version_file` in devkit.toml
# (bash has no TOML reader, so the file is named twice; `adopt` fails when the
# two part). VERSION_PATTERN comes from the file's NAME — pyproject.toml,
# Cargo.toml, package.json or VERSION — else from `[pm] version_pattern` when
# that is also a POSIX ERE; otherwise install-ci refuses and the file is yours
# to write. The pattern is a POSIX extended regex with ONE capture group,
# applied as `sed -n -E "s#<pattern>#\1#p"`, so it may not contain `#`.
env:
  VERSION_FILE: pyproject.toml
  VERSION_PATTERN: '^version[[:space:]]*=[[:space:]]*"([^"]+)".*$'

jobs:
  check-version:
    name: Version must increase
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Extract versions
        id: versions
        run: |
          read_version() { sed -n -E "s#${VERSION_PATTERN}#\1#p" | head -1; }

          # The PR side refuses: a gate comparing "" to "" would wave every PR through.
          if [ ! -f "$VERSION_FILE" ]; then
            echo "::error::Could not read a version on the PR branch: VERSION_FILE='$VERSION_FILE' does not exist. Set [pm] version_file in devkit.toml and re-run install-ci --force."
            exit 1
          fi
          PR_VERSION=$(read_version < "$VERSION_FILE")
          if [ -z "$PR_VERSION" ]; then
            echo "::error::Could not read a version from '$VERSION_FILE' on the PR branch: VERSION_PATTERN='$VERSION_PATTERN' matched no line. Fix VERSION_FILE / VERSION_PATTERN at the head of this workflow."
            exit 1
          fi

          git fetch origin main
          # Main's copy may not exist yet (the first versioned merge); the compare step warns.
          MAIN_VERSION=$(git show "origin/main:$VERSION_FILE" 2>/dev/null | read_version)
          echo "pr_version=$PR_VERSION" >> "$GITHUB_OUTPUT"
          echo "main_version=$MAIN_VERSION" >> "$GITHUB_OUTPUT"
          echo "PR version: $PR_VERSION (from $VERSION_FILE)"
          echo "Main version: ${MAIN_VERSION:-<none on main yet>}"

      - name: Compare versions
        env:
          PR: ${{ steps.versions.outputs.pr_version }}
          MAIN: ${{ steps.versions.outputs.main_version }}
          PM_ROADMAP: pm/roadmap
        run: |
          if [ -z "$PR" ]; then
            echo "::error::Could not read a version from '${VERSION_FILE:-the version file}' on the PR branch: VERSION_PATTERN='${VERSION_PATTERN:-unset}' matched no line."
            exit 1
          fi

          if [ -z "$MAIN" ]; then
            echo "::warning::No version in '${VERSION_FILE:-the version file}' on main yet — first versioned merge. Allowing."
            exit 0
          fi

          # Component-wise, any length; a missing component is 0; non-numeric refuses.
          IFS='.' read -r -a PR_PARTS <<< "$PR"
          IFS='.' read -r -a MAIN_PARTS <<< "$MAIN"
          n=${#PR_PARTS[@]}; [ "${#MAIN_PARTS[@]}" -gt "$n" ] && n=${#MAIN_PARTS[@]}
          verdict=equal
          for ((i = 0; i < n; i++)); do
            p="${PR_PARTS[i]:-0}"; m="${MAIN_PARTS[i]:-0}"
            case "$p$m" in *[!0-9]*)
              echo "::error::Non-numeric version component — main is '$MAIN', PR is '$PR'. Versions are dotted integers only."
              exit 1;;
            esac
            if [ "$p" -gt "$m" ]; then verdict=greater; break
            elif [ "$p" -lt "$m" ]; then verdict=less; break; fi
          done
          if [ "$verdict" != greater ]; then
            echo "::error::Version must increase. Main is $MAIN, PR is $PR. Bump the version in ${VERSION_FILE:-the version file} before merging."
            exit 1
          fi

          # A release is a DONE milestone's id or a hotfix on main's version; a
          # BUILDING milestone's id refuses, so bump-at-start waits for the close.
          legit=""
          case "$PR" in "$MAIN".*)
            rest="${PR#"$MAIN".}"
            case "$rest" in ""|0*|*[!0-9]*) ;; *) legit="appended hotfix $rest on main's $MAIN";; esac;;
          esac
          # The NEXT hotfix: main is <base>.<k>, the PR is <base>.<j> with j > k
          # (same length, only the final component differs). It counts only if
          # <base> is a done milestone's version, asked in the loop below — else
          # successive hotfixes would each have to nest one component deeper.
          # And only if main is NOT itself a done milestone's version or id:
          # then main is a RELEASE, its hotfix is appended, and incrementing it
          # is a bump no milestone declares (0.28.4 -> 0.28.5 over done 0.28).
          base=""; next=""; main_done=""
          case "$MAIN" in *.*)
            k="${MAIN##*.}"
            case "$PR" in "${MAIN%.*}".*)
              j="${PR#"${MAIN%.*}".}"
              case "$k$j" in *[!0-9]*) ;; *)
                case "$k" in ""|0*) ;; *)
                  case "$j" in ""|0*) ;; *)
                    if [ "$j" -gt "$k" ]; then base="${MAIN%.*}"; next="$j"; fi;;
                  esac;;
                esac;;
              esac;;
            esac;;
          esac
          incremented=""
          # id and status come from the frontmatter fence only, so a schema
          # example in the body cannot vouch for the file.
          fm() { tr -d '\r' < "$1" | awk 'NR==1{if($0!="---")exit;next} $0=="---"{printf "%s",buf;exit} {buf=buf $0 "\n"}' | sed -n "s/^$2:[[:space:]]*[\"']\{0,1\}\([^\"']*\)[\"']\{0,1\}[[:space:]]*$/\1/p" | sed 's/[[:space:]]*$//' | head -1; }
          if [ ! -d "$PM_ROADMAP" ]; then
            echo "::error::PM_ROADMAP='$PM_ROADMAP' is not a directory — set the step env to this project's [pm] roadmap_dir. A gate that scanned nothing cannot say OK."
            exit 1
          fi
          # BOTH layouts: `<roadmap>/milestones/<slug>.md` since 0.4.0, and
          # `<roadmap>/<mid>-<slug>/milestone.md` before it. A checkout may be
          # either, and a loop that knew only one scanned zero files and failed
          # every release PR with "the gate scanned nothing".
          scanned=0
          for m in "$PM_ROADMAP"/milestones/*.md "$PM_ROADMAP"/*/milestone.md; do
            [ -f "$m" ] || continue
            # A pool holds shared docs beside the grains; only a document that
            # declares an id is a milestone.
            [ -n "$(fm "$m" id)" ] || continue
            scanned=$((scanned + 1))
            id="$(fm "$m" id)"
            # The incremented hotfix's base, asked of the same two fields.
            if [ -n "$base" ] && [ -z "$incremented" ] && [ "$(fm "$m" status)" = "done" ]; then
              if [ "$(fm "$m" version)" = "$base" ]; then
                incremented="incremented hotfix $next over main's $MAIN, on $base, the version of done milestone $id"
              elif [ "$id" = "$base" ]; then
                incremented="incremented hotfix $next over main's $MAIN, on $base, the id of done milestone $id"
              fi
            fi
            if [ -z "$main_done" ] && [ "$(fm "$m" status)" = "done" ]; then
              if [ "$(fm "$m" version)" = "$MAIN" ]; then main_done="the version of done milestone $id"
              elif [ "$id" = "$MAIN" ]; then main_done="the id of done milestone $id"; fi
            fi
            # A milestone declares its version in `version:`; before that field
            # existed the id WAS the version, so both are asked and either
            # match counts. Asking `id` ALONE never once fired: a scaffolded id
            # is `ms-<slug>` — or `ms-0.4.0`, which is still not `0.4.0` — so
            # the success path of this gate was dead in every layout the tool
            # emits, and a legitimate release PR got the one refusal an
            # operator cannot act on.
            declares=""
            [ "$(fm "$m" version)" = "$PR" ] && declares=version
            [ -n "$declares" ] || { [ "$id" = "$PR" ] && declares=id; } || true
            [ -n "$declares" ] || continue
            status="$(fm "$m" status)"
            if [ "$status" = done ]; then
              legit="the $declares of done milestone $id"
            else
              echo "::error::$PR is the $declares of milestone $id, whose status is '${status:-unset}', not done. A release carries a CLOSED milestone; the bump-at-start of the NEXT milestone waits until the previous close has merged."
              exit 1
            fi
          done
          if [ "$scanned" -eq 0 ]; then
            echo "::error::no milestone document under $PM_ROADMAP/milestones/ or $PM_ROADMAP/*/ — the gate scanned nothing and cannot say OK. Set PM_ROADMAP to this project's [pm] roadmap_dir."
            exit 1
          fi
          if [ -z "$legit" ] && [ -z "$main_done" ]; then legit="$incremented"; fi
          if [ -z "$legit" ]; then
            if [ -n "$incremented" ]; then
              echo "::error::$PR increments the final component of main's $MAIN, and $MAIN is $main_done — a release, not a hotfix — so no done milestone declares $PR. A hotfix of a release is appended ($MAIN.1); a bump to $PR needs a done milestone at that version."
              exit 1
            fi
            echo "::error::$PR is the version or id of no done milestone under $PM_ROADMAP, is not main's version ($MAIN) plus one appended hotfix component, and does not increment the final component of a main that is already a hotfix of a done milestone's version. A release is a closed milestone or a hotfix; the NEXT milestone's bump-at-start waits until this merge has landed."
            exit 1
          fi
          echo "Version bump OK: $MAIN -> $PR ($legit)"
