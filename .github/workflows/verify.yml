# GENERATED by godot-devkit v0.14.0 — `godot-devkit install-ci`.
#
# Deliberately almost contentless, and identical in every repo that installs it.
# It runs ONE command; what that command executes is entirely this project's,
# declared in devkit.toml:
#
#     [tasks]
#     verify = "..."      # your own full gate
#
# So CI cannot drift from the local gate: they are the same target, named once.
# Change what CI runs by changing that target, never by editing this file.
name: verify

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The PM gates read `git worktree list` and branch placement, and the
          # doc gates read tracked files. A shallow checkout answers both
          # wrongly.
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
      - name: godot-devkit task verify
        run: uvx --from "$DEVKIT" godot-devkit task verify
        env:
          DEVKIT: .
