# GENERATED by godot-devkit — `godot-devkit install-ci`.
#
# One job, one opinion: check out, ARM the checkout, install the toolchain this
# project declares, run this project's full gate. CI runs the same target the
# local full gate does — but the same target is not the same ANSWER unless the
# tree it runs on carries the same repo-local state. `core.hooksPath` is the
# measured case: it lives in .git/config, nothing tracked carries it, and a
# fresh checkout has never had it set, so a gate that asks whether this tree is
# armed was red on every CI run of a repo that runs one. The steps between the
# checkout and the gate are there to close exactly that gap.
#
# ASSUMES `make milestone` is your full gate. Nothing here discovers that — a
# project without the target gets a red run step naming it, which is where the
# assumption belongs. Add the target, or change the `run:` line.
#
# THE TOOLCHAIN IS KEYED OFF THE PROJECT. A Godot project's full gate boots the
# engine and shells out to gdlint and shellcheck; setup-uv alone only satisfies
# the pinned devkit package. So every step that installs one of those carries
# `if: hashFiles('project.godot') != ''` — a game repo installs the engine, a
# repo with no engine in it (this package, installing this file into itself)
# skips them and runs the gate on uv alone. One file, right in both trees.
#
# After this file is written it is YOURS. Edit it here; re-installing needs
# --force, and `--diff` shows what a re-install would change.
name: verify

# Project config — the one knob. The engine's MAJOR.MINOR is read from
# project.godot `config/features` (where Godot itself records it), so CI can
# never test on an engine line the project does not declare. The patch level is
# the part that file does not carry, and it is the part you edit.
env:
  GODOT_PATCH: "2"

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The PM gates read `git worktree list` and branch placement, and the
          # doc gates read tracked files. A shallow checkout answers both
          # wrongly.
          fetch-depth: 0
      - name: Arm the tracked git hooks
        # Repo-local git config, and a checkout has none: `core.hooksPath` is
        # unset here however armed the developer's tree is, so `check hooks`
        # reports UNARMED and the full gate reds for a fact about the runner
        # rather than about the code. Guarded the way the engine steps are — a
        # repo that does not ship the arming script has no corpus to arm and
        # skips this, exactly as a repo with no project.godot skips the engine.
        if: hashFiles('tools/setup-hooks.sh') != ''
        run: bash tools/setup-hooks.sh
      - uses: astral-sh/setup-uv@v5
      - name: Godot version, from project.godot
        id: godot-version
        if: hashFiles('project.godot') != ''
        # The first `config/features` entry shaped MAJOR.MINOR is the engine
        # line the project declares. Everything this cannot read is refused BY
        # NAME and emits no version at all: handing setup-godot a half-derived
        # string fails later, further away, as a download 404.
        run: |
          set -eu
          if [ ! -f project.godot ]; then
            echo "no project.godot here — there is no engine line to derive." >&2
            exit 1
          fi
          if ! grep -q '^config/features=' project.godot; then
            echo "project.godot has no config/features line, which is where Godot records the engine line." >&2
            exit 1
          fi
          entries="$(sed -n 's/^config\/features=PackedStringArray(\(.*\))[[:space:]]*$/\1/p' project.godot | head -n 1)"
          engine="$(printf '%s\n' "$entries" | tr ',' '\n' | tr -d ' "' | grep -m 1 -E '^[0-9]+\.[0-9]+$' || true)"
          if [ -z "$engine" ]; then
            echo "config/features holds no MAJOR.MINOR engine entry ($entries), so the engine line is unknowable here." >&2
            exit 1
          fi
          case "${GODOT_PATCH:-}" in
            '' | *[!0-9]*)
              echo "GODOT_PATCH at the head of this workflow is '${GODOT_PATCH:-}', which is not a patch number." >&2
              exit 1
              ;;
          esac
          echo "Godot $engine.$GODOT_PATCH — config/features declares $engine, this workflow pins patch $GODOT_PATCH."
          echo "version=$engine.$GODOT_PATCH" >> "$GITHUB_OUTPUT"
      - uses: chickensoft-games/setup-godot@v2
        if: hashFiles('project.godot') != ''
        with:
          version: ${{ steps.godot-version.outputs.version }}
          include-templates: false
          use-dotnet: false
      - name: Install gdlint + shellcheck
        if: hashFiles('project.godot') != ''
        # `make doctor` is the local census of the same toolchain: engine,
        # gdlint, shellcheck, uv.
        run: |
          uv tool install "gdtoolkit==4.*"
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
      - name: make milestone
        # The gates print one verdict line each and keep the transcript in
        # .gate-reports/; CI has no second look, so it streams.
        env:
          VERBOSE: "1"
        run: make milestone
      - name: keep the gate transcripts of a red run
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gate-reports
          path: .gate-reports/
          if-no-files-found: ignore
