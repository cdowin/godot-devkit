# verify: this repo's own check, `make check` (shellcheck and a dry run of the game Makefile). It
# runs no Godot. The job `gate` is the required check and always reports.
name: verify

on:
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - run: make check
  gate:
    needs: [verify]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - env:
          RESULT: ${{ needs.verify.result }}
        run: |
          echo "verify: $RESULT"
          [ "$RESULT" = success ]
