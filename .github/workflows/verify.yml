# CI runs the SAME target the local full gate does — `make milestone` — so the
# two cannot drift. An ordinary committed file: edit it here.
name: verify

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The PM gates read `git worktree list` and branch placement, and the
          # doc gates read tracked files. A shallow checkout answers both
          # wrongly.
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
      - name: make milestone
        run: make milestone
