# GENERATED by agentic-sdlc — `agentic-sdlc install-ci`.
#
# One job here (the stock file has three): check out, ARM the checkout, install
# the agentic-sdlc version uv.lock pins, and run `make milestone`, whose
# `matrix` tier runs every claimed interpreter. Claimed in devkit.toml's
# `[adopt] ours`, so adopt names it rather than asking for --force.
#
# CI is the one confirmation at merge: the hooks and belts already run the
# gates on every commit, so this runs once per pull request into main, not
# again on the push that merges it. There is no `paths-ignore`, because a
# REQUIRED check that is skipped blocks the merge. By design, nothing
# re-verifies the merge commit: the check ran on the pull request's tree, and
# the ruleset's `strict` is false, so main may move after that run.
name: verify

on:
  pull_request:
    branches: ["main"]
  workflow_dispatch:

# A new push to the same pull request cancels the run it makes stale.
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          # The PM and doc gates read worktrees, branches and tracked files.
          fetch-depth: 0
      - name: Arm the tracked git hooks
        # `core.hooksPath` is repo-local config a fresh checkout never has.
        if: hashFiles('tools/setup-hooks.sh') != ''
        run: bash tools/setup-hooks.sh
      - uses: astral-sh/setup-uv@v10.2.0
      - name: Install the kit uv.lock pins
        # `make` runs .venv/bin/agentic-sdlc, the version uv.lock pins; this
        # installs exactly that, from the lock, before any step calls make.
        if: hashFiles('uv.lock') != ''
        run: |
          if grep -qx 'name = "agentic-sdlc"' uv.lock; then uv sync --frozen; fi
      - name: Install the pinned shellcheck
        # `[shell] shellcheck_version` pins the shellcheck `check shell` may
        # run; this installs that release, so a local pass is a CI pass. The
        # pin is read through the tool (`check shell --pin`); unset, it prints
        # an empty line and this step installs nothing.
        if: hashFiles('devkit.toml') != ''
        run: |
          pin="$(make -s sdlc ARGS='check shell --pin')"
          if [ -n "$pin" ]; then
            curl -fsSL "https://github.com/koalaman/shellcheck/releases/download/v${pin}/shellcheck-v${pin}.linux.x86_64.tar.gz" \
              | tar -xz -C "$RUNNER_TEMP"
            echo "$RUNNER_TEMP/shellcheck-v${pin}" >> "$GITHUB_PATH"
          fi
      # --- your toolchain goes here -----------------------------------------
      #   - name: Install the linters this project's gate shells out to
      #     if: hashFiles('<a file only this kind of project has>') != ''
      #     run: |
      #       uv tool install "<linter>"
      #       sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
      # ----------------------------------------------------------------------
      - name: make milestone
        # CI has no second look, so the gates stream. This repo's `matrix`
        # tier runs every interpreter itself (the floor the whole suite), so
        # the stock per-interpreter `python` job is not used here: its legs
        # would pass a PY_MATRIX without the floor, which `matrix` refuses.
        env:
          VERBOSE: "1"
        run: make milestone
      - name: keep the gate transcripts of a red run
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: gate-reports
          path: .gate-reports/
          if-no-files-found: ignore
          retention-days: 3
