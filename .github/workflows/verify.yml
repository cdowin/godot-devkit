# verify — this repo's own CI, through its own gate framework: `make verify`
# is `check` (shellcheck over tracked scripts, the eight Godot gates over the
# fixture project) plus the `matrix` tier, which runs the suite on every
# interpreter the package claims. No Godot binary and no agentic-sdlc.
#
# The triggers are deliberately unfiltered (no `paths:`): the required check
# `verify` must always report, and a path filter would leave it missing on a
# docs-only pull request, which could then never merge. Skipping is done by the
# `changes` job instead, because a skipped job counts as passing. A pull
# request that touches only *.md, docs/, .claude/ or the issue and PR templates
# skips the build. Shipped code is never skipped, whatever its extension: the
# first case below names it.
#
# By design, nothing re-verifies the merge commit: the check ran on the pull
# request's tree, and the ruleset's `strict` is false, so main may move after
# that run.
name: verify

on:
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

# A new push to the same pull request cancels the run it makes stale.
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.decide.outputs.code }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: decide
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          code=true
          files=""
          if [ "$EVENT" = "pull_request" ]; then
            files=$(git diff --name-only "origin/$BASE_REF...HEAD")
          fi
          echo "Event: $EVENT"
          echo "Changed files:"
          echo "$files"
          if [ -n "$files" ]; then
            code=false
            while IFS= read -r f; do
              case "$f" in
                # Shipped code, whatever its extension (an installable or a
                # fixture that happens to be Markdown is still code).
                src/*|tests/*|tools/*) code=true ;;
                *.md|docs/*|.claude/*|.github/ISSUE_TEMPLATE/*|.github/pull_request_template.md) ;;
                *) code=true ;;
              esac
            done <<< "$files"
          fi
          echo "Decision: code=$code"
          echo "code=$code" >> "$GITHUB_OUTPUT"

  verify:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SHELLCHECK_VERSION: "0.11.0"
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
      - name: Install the pinned shellcheck
        # The `shell` gate runs this release, so a local pass is a CI pass.
        run: |
          curl -fsSL "https://github.com/koalaman/shellcheck/releases/download/v${SHELLCHECK_VERSION}/shellcheck-v${SHELLCHECK_VERSION}.linux.x86_64.tar.gz" \
            | tar -xz -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/shellcheck-v${SHELLCHECK_VERSION}" >> "$GITHUB_PATH"
      - name: make verify
        # CI has no second look, so the gates stream. The `matrix` tier runs
        # every interpreter itself (the floor runs the whole suite).
        env:
          VERBOSE: "1"
        run: make verify
      - name: keep the gate transcripts of a red run
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: gate-reports
          path: .gate-reports/
          if-no-files-found: ignore
          retention-days: 3
