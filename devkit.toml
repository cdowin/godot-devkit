# godot-devkit's config for godot-devkit. The toolkit runs its own gates on its
# own tree: a gate nobody points at its author is a gate nobody has tested at
# the one place its defects are cheapest to find.
#
# Everything here is a SCOPE or an APPLICABILITY statement. Nothing weakens a
# rule, and nothing is a fork — rule 5 is that per-project variation lives in
# this file, and this file is the proof it can.

[checks]
# `all` is the PINNED kit's roster — what `agentic-sdlc check all` runs here,
# and the first half of `make check`. The four repo-discipline gates all
# apply to this tree: `shell` since the repo started self-hosting its hook
# corpus under tools/ (0.23.0), and `hooks` because the sentence was not
# enough — `core.hooksPath` was unset in every checkout of this repo for two
# releases while CLAUDE.md said the corpus was armed, and no target looked.
# It is stock-OFF for consumers (arming is a decision each makes once) and on
# for the repo that told them to.
#
# `godot` is THIS package's roster — what `godot-devkit check all` runs — and
# it is deliberately NOT set: the stock eight, on the committed clean Godot
# project that `godot-check` stages (tools/dev/godot_devkit_on_fixture.sh),
# with no devkit.toml in that scratch tree either. Two kits read one file, so
# each roster has its own key; a name in the wrong one is refused by both.
all = ["doc", "pm", "shell", "hooks", "budget", "grain-shape"]

# This package's OWN gates, as make targets `make check` runs after the roster
# above — the same seam a consumer uses. `godot-check` is Makefile.tiers'
# (`install-runners` writes it): `godot-devkit check all`, the eight Godot
# gates, run against the committed clean Godot project rather than this tree,
# which holds no scene outside its fixtures (a 0-file census is a FAIL by
# rule 4, not a roster entry).
[gates]
extra = ["godot-check"]

# What the pinned kit's `check doc` holds to the tree: the always-loaded files
# (its stock scope) plus the surfaces a consumer reads first. Every backtick
# path and `make <target>` in them must resolve; docs/reviews/ is records.
[doc]
scope = ["CLAUDE.md", "README.md", "SDLC.md", "docs/*.md", "docs/design/*.md",
         ".claude/rules/*.md", ".claude/agents/*.md"]
ephemeral = ["docs/reviews/"]

# The verification ladder `agentic-sdlc verify` runs, one make target per rung.
# story is the inner loop (the suite minus the spawns, seconds); feature is the
# close of a feature (the whole suite on the floor, minutes); milestone is the
# full gate and what CI runs (check + the matrix). Makefile.tiers defines them.
[verify]
story = "make pyunit"
feature = "make test"
milestone = "make milestone"

# The ceilings `check budget` grades, keyed by tier as the ledger records them
# (`pyunit` is the story rung, `test` the feature rung). Measured at the close
# of 0.25.0's suite pass and set roughly ten percent above the result: a tier
# that grows past its number, or a case count that climbs, is a finding to
# explain in the commit that caused it — never a number to raise in passing.
[tests]
budget = { pyunit = 2, test = 35 }
cases  = { pyunit = 51, test = 221 }

# Caps raised above stock, each to cover a record written before this gate
# existed and measured at adoption (0.25.0): six bugs at 54-191 body lines
# (stock 50), one story at 64 (stock 60), one feature at 141 (stock 80), and
# the two 2026-08-30 review records at 255 and 373 (stock 120). They are
# closed and are not rewritten to fit a cap that arrived after them; new
# grains stay under stock by habit, and this line is what makes each
# exception visible rather than silent.
[grain_shape]
caps = { bug = 200, story = 70, feature = 150, review = 380 }

# The deliberately-drifted Godot corpus under tests/fixtures/ is the INPUT to
# this package's tests, not content this repo maintains: a stale uid and a
# path-only ext_resource are there on purpose, and the tests point each gate at
# a temp copy of them to prove it fires. Excluded here so a gate run at the repo
# root reports this repo, while the tests keep proving the gate works.
[uid]
exclude_prefixes = ["addons/", "tests/fixtures/"]

[tres]
exclude_prefixes = ["addons/", "tests/fixtures/"]

[props]
exclude_prefixes = ["addons/", "tests/fixtures/"]

[pm]
# Everything opt-in except D8. The rules this package ships OFF by default are
# off because a consumer's legacy tree would go red on upgrade day — this tree
# has no legacy, so it takes all of them and stays inside them from entry one.
#
# D8 (project version == the building milestone's id) is the one rule that does
# not apply, and it says so itself: it encodes bump-at-START, and this package
# bumps at CLOSE, in the release commit, per the release skill. Enabling it here
# would mean publishing 0.14.0 in pyproject.toml before 0.14.0 exists. A rule
# that fits a different valid flow is not a rule to switch on and pad around.
#
# D9 and D10 DO apply: work happens on `milestone/<id>` (SDLC.md §1), main is
# merge-commit-only at close, and D3 (0.16.0) is the decision that caught this
# tree working on main while telling its consumers not to — D10 is what stops
# that recurring silently.
checks = [
    "D1", "D2", "D4", "D5", "D6",
    "D9", "D10", "D11", "D12",
    "V1", "V4", "V5", "V7",
    "U1",
]
# D11 replaced D3 in agentic-sdlc 0.6.0 (open children, at every level); V2, V3
# and V6 were retired in 0.4.0 with the path-as-identity and generated
# execution lists they graded.
# Nothing else is set. The prose ratchets, their six line caps and their three
# grandfather ledgers were deleted in 0.15.0, and every key they read is now
# named at exit 2 by `check pm` — so this file declares scope and roster, and
# says nothing about the length of anybody's markdown.

# --- the flow — appended by `agentic-sdlc pm init` ----------------------------
# Every state this project uses, each in exactly one of todo / in_progress /
# done. Yours: `pm vocabulary` echoes it, every run reads it, and there is no
# default behind it (CLAUDE.md hard rule 5).
[pm.states.milestone]
todo        = ["planning", "ready"]
in_progress = ["building", "reviewing", "accepted", "packaging"]
done        = ["done", "obe"]

[pm.states.feature]
todo        = ["planning", "ready"]
in_progress = ["building", "reviewing"]
done        = ["done", "obe"]

[pm.states.story]
todo        = ["planning", "ready"]
in_progress = ["building"]
done        = ["done", "obe"]

[pm.states.bug]
todo        = ["open"]
in_progress = ["fixed"]
done        = ["closed"]

[dispatch]
project = "godot-devkit — scene tooling and the eight Godot gates for Godot 4.x, a pinned-tag stdlib-only Python package. Pure parse, never boots Godot; the CLI is a published API. Public repo, MIT."
contracts = ["CLAUDE.md", ".claude/rules/pm-execution.md"]
