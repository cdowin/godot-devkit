# Example godot-devkit.toml: one example of every key a reader accepts.
# tests/test_boundaries.py checks that each key a reader accepts appears here in its right shape.
# The wiki page "Configuration reference" shows this file. Optional at the repo root; stock defaults apply.
[roster]
checks = ["uid", "props"]          # replaces the stock `check all` roster for THIS repo (stock:
                                   # props tres-comment unit-disk; opt-in: uid patterns addon);
                                   # an unknown or removed name exits 2

[uid]
exclude_prefixes = ["addons/"]     # scopes every uid check
[props]
exclude_prefixes = ["addons/"]
baseline = { "scenes/legacy/hub.tscn" = 2 }
extra_properties = { MyWidget = ["virtual_prop"] }   # a `_get_property_list` shape the scanner
                                   # cannot see; the key is the class_name (or an ancestor's) or
                                   # the engine type, and the carve-out applies only to it
[tres_comment]
exclude_prefixes = ["addons/"]
baseline = { "data/legacy/tuning.tres" = 12 }
[unit_disk]
roots = ["tests/unit"]
forbidden_literals = { "a real save path" = ["user://saves/", "user://settings\\.json"] }
                                   # a TABLE, reason = [regexes], like forbidden_calls — not a
                                   # list; stock { "a real user:// path" = ["user://"] }
forbidden_calls = { "the live settings autoload" = ["SettingsManager\\.(save|load)_settings\\("] }
min_args = { "SaveService.save" = 2 }
baseline = { "tests/unit/test_save_roundtrip.gd" = 3 }
[autoloads]
suffixes = { Manager = "emits", Registry = "inert" }
expected_prefixes = ["autoloads/core/", "autoloads/presentation/"]
[refs]
exclude_prefixes = [".git/", ".godot/", "addons/"]
[orphans]
vendored_prefixes = ["addons/"]
entry_point_prefixes = ["tools/"]
auto_discovered_prefixes = ["tests/", "data/"]
convention_files = ["default_bus_layout.tres"]
[stats]
tests = ["tests/"]
tools = ["tools/"]
vendored = ["addons/"]                # list only the vendored addons; your own addon is game code
[pot]
output = "locale/messages.pot"     # required by `godot-devkit pot`: repo-relative, ends in .pot;
                                   # Godot stores no POT path in project.godot
[[patterns.rule]]                   # opt-in: name "patterns" in [roster] checks. No rule is built in
id = "no-print"
regex = "\\bprint\\("
paths = ["src/**/*.gd"]
exclude = ["src/debug/**"]         # optional
message = "Use the logger, not print()."
                                   # a line opts out with `# lint-allow: no-print`
[addon]                            # opt-in: name "addon" in [roster] checks
paths = ["addons/kit/**"]          # stock: addons/**; what the add-on ships
exclude = ["addons/kit/demo/**"]   # optional
theme_keys_class = "KitThemeKeys"  # optional: turns on theme-key-literal; a tracked .gd must declare it
uid_exempt = { "addons/kit/gen/tmp.gd" = "regenerated by the build" }   # file = reason
                                   # a line opts out of a code rule: `# lint-allow: tree-meta -- <why>`

[ui_fit]                           # `make ui-fit`: boots these scenes under stress; absent = the stock values
scenes = ["ui/gallery/"]           # stock: ui/gallery/; .tscn files or folders ending "/" (subfolders too)
smallest_window = [1280, 720]      # stock
largest_window = [3840, 2160]      # stock
large_text_hook = "res://ui/text_size.gd:use_large_text"   # stock: "" (no large-text pass); a static func, no arguments

[fit_sweep]                        # `make fit-sweep`: every scene at every size class; no stock values
table = "design/layout.json"       # required: repo-relative size-class table (a design system layout.json, format 1)
scenes = ["res://ui/title.tscn", "res://ui/screens/**"]   # required: res:// scenes or globs (** crosses folders)
