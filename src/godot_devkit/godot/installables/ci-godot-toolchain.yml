# GENERATED by godot-devkit — `godot-devkit install-runners`.
#
# The Godot toolchain for CI, as ONE step in the toolchain slot of your
# .github/workflows/verify.yml (agentic-sdlc's `install-ci` writes that file
# and leaves the slot empty). The full gate boots the engine and shells out to
# gdlint and shellcheck; this installs each at the version the laptop runs,
# then imports the project, so `make milestone` on the runner reads the same
# tree the local gate reads. Paste, AFTER `astral-sh/setup-uv` (step 3 installs
# gdlint with `uv tool`):
#
#     - uses: ./.github/actions/godot-toolchain
#       with: { godot-patch: "<n>" }
#
# The engine's MAJOR.MINOR is read from project.godot `config/features`, where
# Godot itself records it, so CI never tests on an engine line the project does
# not declare. The patch is the part that file does not carry: that is the one
# input with no default.
#
# Why each pin: apt's shellcheck is older than the one `make doctor` checks
# (0.11.0 passes scripts apt's copy flags), `gdtoolkit==4.*` floats, and a run
# with no import pass does not resolve `class_name` globals or imported assets.
#
# godot-devkit itself, when your uv.lock names it (the locked shape, #38): the
# first step runs `uv run --frozen godot-devkit --version`, so .venv is synced
# to the lock, at exactly the locked version and hash, before any gate, and a
# kit that does not start fails here. It syncs whenever uv.lock names the kit,
# even when a Makefile `GODOT_DEVKIT_VERSION` pin wins and Makefile.tiers runs
# that pinned tag instead: one sync nothing uses, never a wrong kit.
# The index is public: no token. A lock that does not name the kit skips it.
#
# A runner image may carry the engine at `<godot-root>/<version>/godot` (input
# `godot-root`, default /opt/godot). Then this uses that binary and downloads
# nothing; otherwise setup-godot fetches it. shellcheck skips its download
# when the installed one is the pinned version.
#
# A workflow that imports once per run, then restores `.godot/` in its other
# jobs, passes `import: false` to them: the import pass costs an engine boot.
#
# After this file is written it is YOURS. Edit it here; re-installing needs
# --force, and `--diff` shows what a re-install would change.
name: godot-toolchain
description: godot-devkit from uv.lock (when locked), the Godot engine (line from project.godot; a preinstalled one when present), gdlint and shellcheck at pinned versions, and an import pass (unless import is false).

inputs:
  godot-patch:
    description: The engine patch number; MAJOR.MINOR comes from project.godot config/features.
    required: true
  gdtoolkit-version:
    description: The gdtoolkit (gdlint) version, installed with uv tool.
    required: false
    default: "4.5.0"
  shellcheck-version:
    description: The shellcheck release, from its release tarball.
    required: false
    default: "0.11.0"
  godot-root:
    description: Where a runner image keeps preinstalled engines, as <godot-root>/<version>/godot. A missing one falls back to setup-godot.
    required: false
    default: /opt/godot
  import:
    description: Run the import pass. Pass false when this job restored a .godot/ that an earlier job of the run imported.
    required: false
    default: "true"

runs:
  using: composite
  steps:
    - name: godot-devkit, from uv.lock
      # Only when the lock names it; a sync in a repo that never locked the
      # kit would install an environment this step has no business with.
      shell: bash
      run: |
        set -eu
        if [ -f uv.lock ] && grep -qx 'name = "godot-devkit"' uv.lock; then
          uv run --frozen godot-devkit --version
        else
          echo "uv.lock does not name godot-devkit — nothing to sync (the legacy GODOT_DEVKIT_VERSION pin resolves through uvx)."
        fi
    - name: Godot version, from project.godot
      id: godot-version
      # The first `config/features` entry shaped MAJOR.MINOR is the engine
      # line the project declares. Everything this cannot read is refused BY
      # NAME and emits no version at all: handing setup-godot a half-derived
      # string fails later, further away, as a download 404.
      shell: bash
      env:
        GODOT_PATCH: ${{ inputs.godot-patch }}
      run: |
        set -eu
        if [ ! -f project.godot ]; then
          echo "no project.godot here — there is no engine line to derive." >&2
          exit 1
        fi
        if ! grep -q '^config/features=' project.godot; then
          echo "project.godot has no config/features line, which is where Godot records the engine line." >&2
          exit 1
        fi
        entries="$(sed -n 's/^config\/features=PackedStringArray(\(.*\))[[:space:]]*$/\1/p' project.godot | head -n 1)"
        engine="$(printf '%s\n' "$entries" | tr ',' '\n' | tr -d ' "' | grep -m 1 -E '^[0-9]+\.[0-9]+$' || true)"
        if [ -z "$engine" ]; then
          echo "config/features holds no MAJOR.MINOR engine entry ($entries), so the engine line is unknowable here." >&2
          exit 1
        fi
        case "${GODOT_PATCH:-}" in
          '' | *[!0-9]*)
            echo "the godot-patch input is '${GODOT_PATCH:-}', which is not a patch number." >&2
            exit 1
            ;;
        esac
        echo "Godot $engine.$GODOT_PATCH — config/features declares $engine, the godot-patch input pins $GODOT_PATCH."
        echo "version=$engine.$GODOT_PATCH" >> "$GITHUB_OUTPUT"
    - name: Godot, preinstalled on the runner image
      id: preinstalled
      shell: bash
      env:
        GODOT_ROOT: ${{ inputs.godot-root }}
        VERSION: ${{ steps.godot-version.outputs.version }}
      run: |
        set -eu
        bin="$GODOT_ROOT/$VERSION/godot"
        if [ -x "$bin" ]; then
          echo "Godot $VERSION is preinstalled at $bin: no download."
          echo "$GODOT_ROOT/$VERSION" >> "$GITHUB_PATH"
          { echo "GODOT=$bin"; echo "GODOT4=$bin"; } >> "$GITHUB_ENV"
          echo "found=true" >> "$GITHUB_OUTPUT"
        else
          echo "No $bin on this runner: setup-godot fetches Godot $VERSION."
          echo "found=false" >> "$GITHUB_OUTPUT"
        fi
    - uses: chickensoft-games/setup-godot@v2
      if: steps.preinstalled.outputs.found != 'true'
      with:
        version: ${{ steps.godot-version.outputs.version }}
        include-templates: false
        use-dotnet: false
    - name: gdlint (gdtoolkit ${{ inputs.gdtoolkit-version }})
      shell: bash
      env:
        GDTOOLKIT_VERSION: ${{ inputs.gdtoolkit-version }}
      run: |
        set -eu
        uv tool install "gdtoolkit==$GDTOOLKIT_VERSION"
        gdlint --version
    - name: shellcheck ${{ inputs.shellcheck-version }}, from the release tarball
      shell: bash
      env:
        SHELLCHECK_VERSION: ${{ inputs.shellcheck-version }}
      run: |
        set -eu
        v="$SHELLCHECK_VERSION"
        if shellcheck --version 2>/dev/null | grep -qx "version: $v"; then
          echo "shellcheck $v is installed: no download."
          exit 0
        fi
        # The runner's arch: a self-hosted runner may be linux/arm64 (#79).
        case "$(uname -m)" in aarch64|arm64) a=aarch64 ;; *) a=x86_64 ;; esac
        curl -fsSL "https://github.com/koalaman/shellcheck/releases/download/v$v/shellcheck-v$v.linux.$a.tar.xz" \
          | tar -xJ -C "$RUNNER_TEMP"
        sudo install -m 0755 "$RUNNER_TEMP/shellcheck-v$v/shellcheck" /usr/local/bin/shellcheck
        shellcheck --version
    - name: Import the project
      # The import's own exit is noisy (a missing optional asset, a plugin
      # warning), so it only warns. The ASSERT is the gate: with no class cache
      # the `class_name` globals do not resolve and every tier after this
      # fails for a fact about the runner rather than about the code. With
      # `import: false` the assert still runs, on the restored .godot/.
      shell: bash
      env:
        IMPORT: ${{ inputs.import }}
      run: |
        if [ "$IMPORT" = true ]; then
          "$GODOT" --path . --headless --import \
            || echo "::warning::godot --import exited non-zero; the class-cache check below decides."
        else
          echo "import: false — this job uses the .godot/ an earlier job imported."
        fi
        test -f .godot/global_script_class_cache.cfg \
          || { echo "::error::no .godot/global_script_class_cache.cfg after the import pass." >&2; exit 1; }
