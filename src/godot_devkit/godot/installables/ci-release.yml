# GENERATED by godot-devkit — `godot-devkit install-runners`.
#
# The release workflow for a Godot game: a version and a commit become a GitHub
# Release with one downloadable build per export preset. It is written to
# .github/workflows/release.yml. Two triggers, one run:
#
#   - `workflow_dispatch` with a `tag` input (required) and a `sha` input
#     (optional; default: the commit of the dispatch ref). The tag need not
#     exist. A dispatcher (an auto-tag job, or any decide step) passes both:
#     `gh workflow run release.yml -f tag=<tag> -f sha=<sha>`. A tag pushed
#     with GITHUB_TOKEN starts no workflow, which is why the dispatch exists.
#   - `push: tags: ["v*"]`: a tag a person pushes. The tag is the ref name and
#     the sha is the tag's commit.
#
# THE TAG IS CREATED LAST. Nothing creates the tag until the gate and every
# export are green, so a failed gate or export leaves no tag and no Release.
#
# Jobs, in order:
#
#   config   resolves the tag (it must start with `v`) and the sha, then reads
#            the `[release]` section of godot-devkit.toml and, where it says
#            nothing, derives the rest from the repo. Emits the sha, the preset
#            matrix, the gate matrix and timeout, and the version-injection
#            settings. Every job checks out that sha.
#   gate     one parallel job per `gate` entry (`make <entry>`) on that commit,
#            after the godot-toolchain action. Any red job stops the release.
#            Skipped when there are no entries.
#   export   one job per preset: Godot with export templates, your
#            `before_export` commands, `--export-release`, an archive, and an
#            upload of the archive as a workflow artifact (`release-<slug>`,
#            kept 1 day). It publishes nothing.
#   release  after every export is green: downloads the archives. If the tag
#            exists at another commit it fails and creates nothing; at the same
#            commit (a pushed tag) it carries on. Then it creates or updates
#            the GitHub Release (this creates the tag at the sha) and uploads
#            the assets with `--clobber`. The body is the `## Release notes`
#            section of the pull request that merged the commit, or
#            `--generate-notes` when there is none.
#
# The `[release]` keys in godot-devkit.toml, and what an absent key means:
#
#   godot_patch          REQUIRED. The engine patch number; MAJOR.MINOR is read
#                        from project.godot `config/features`. No default.
#   title                The Release title is "<title> <tag>". Default: the
#                        repository name.
#   gate                 The release gate: a string, or a list of entries. EACH
#                        ENTRY IS ONE PARALLEL JOB running `make <entry>`. An
#                        entry is a string, or a list of strings joined by
#                        spaces; it may name several targets and make
#                        variables, so a suite can be sharded:
#                          gate = ["gates-self-test", "check parse lint warnings unit",
#                                  "integration-all GDK_SHARD=1/3",
#                                  "integration-all GDK_SHARD=2/3",
#                                  "integration-all GDK_SHARD=3/3"]
#                        Default: `verify` when a Makefile defines it, else
#                        `milestone`, else none. "" or [] skips the gate.
#   gate_timeout         The `timeout-minutes` of each gate job: a positive
#                        integer. Default: 30.
#   before_export        A list of shell commands run before each export, in
#                        the repo root, with $GODOT set. Default: none.
#   version_file         A file whose placeholder is replaced with the version
#                        (the tag without its `v`) before the export. Default:
#                        "" (no injection). The build fails when the file does
#                        not hold the placeholder.
#   version_placeholder  The text to replace in version_file. Default: "".
#   presets              A list of `[[release.presets]]` tables with `preset`
#                        (the export preset name), and optionally `output`,
#                        `archive` ("zip" or "tar.gz") and `name`. Default:
#                        every `[preset.N]` of export_presets.cfg that has a
#                        `name` and an `export_path`: output is the
#                        export_path; archive is tar.gz for a name that holds
#                        "linux" and zip for any other.
#
# Each asset is `<repo>-<preset name, lowercased, non-alphanumerics as "-">`
# with the archive's extension. Its content is the directory the output sits
# in, so an `output` needs a directory of its own.
#
# This file never deletes an Actions cache or artifact: the permission it
# holds is `contents: write` and nothing else. A runner image that carries
# Godot at /opt/godot/<version>/godot serves the gate with no download; the
# export needs the engine's export templates, which only setup-godot installs,
# so the export job always calls it. Every job runs on x64 and arm64.
#
# After this file is written it is YOURS. Edit it here; re-installing needs
# --force, and `--diff` shows what a re-install would change.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: The tag to release (vX.Y.Z). It need not exist yet.
        required: true
        type: string
      sha:
        description: The commit to release. Default is the commit of the dispatch ref.
        required: false
        type: string

permissions:
  contents: write

# One run per tag. A second run of the same tag waits for the first.
concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  GH_TOKEN: ${{ github.token }}

jobs:
  config:
    name: Read the release config
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      sha: ${{ steps.tag.outputs.sha }}
      presets: ${{ steps.config.outputs.presets }}
      gates: ${{ steps.config.outputs.gates }}
      gate_timeout: ${{ steps.config.outputs.gate_timeout }}
      before_export: ${{ steps.config.outputs.before_export }}
      version_file: ${{ steps.config.outputs.version_file }}
      version_placeholder: ${{ steps.config.outputs.version_placeholder }}
      title: ${{ steps.config.outputs.title }}
      godot_patch: ${{ steps.config.outputs.godot_patch }}
      godot_version: ${{ steps.config.outputs.godot_version }}
    steps:
      - name: Resolve the tag
        id: tag
        env:
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_SHA: ${{ inputs.sha }}
        run: |
          set -eu
          TAG="${INPUT_TAG:-$GITHUB_REF_NAME}"
          case "$TAG" in
            v?*) ;;
            *)
              echo "::error::The tag '$TAG' does not start with v. Dispatch with a tag input, or at a v* tag."
              exit 1
              ;;
          esac
          # A pushed tag: GITHUB_SHA is the tag's commit. A dispatch: the input,
          # else the dispatch ref's commit. The API resolves a short sha or a
          # branch name to the full sha.
          SHA=$(gh api "repos/$GITHUB_REPOSITORY/commits/${INPUT_SHA:-$GITHUB_SHA}" --jq .sha)
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "Releasing $TAG at $SHA."
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.tag.outputs.sha }}
      - name: Read godot-devkit.toml [release]
        id: config
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          import sys
          import tomllib
          from pathlib import Path


          def fail(message):
              print(f"::error::{message}")
              sys.exit(1)


          cfg = {}
          toml = Path("godot-devkit.toml")
          if toml.is_file():
              try:
                  cfg = tomllib.loads(toml.read_text(encoding="utf-8")).get("release", {})
              except tomllib.TOMLDecodeError as err:
                  fail(f"godot-devkit.toml does not parse: {err}")
          if not isinstance(cfg, dict):
              fail("[release] in godot-devkit.toml must be a table.")


          def text(key, default=""):
              value = cfg.get(key, default)
              if not isinstance(value, str):
                  fail(f"[release] {key} must be a string.")
              return value


          def strings(key):
              value = cfg.get(key, [])
              if not isinstance(value, list) or not all(isinstance(v, str) for v in value):
                  fail(f"[release] {key} must be a list of strings.")
              return value


          def has_target(target):
              pattern = re.compile(rf"^{re.escape(target)}[ \t]*:", re.M)
              return any(
                  pattern.search(f.read_text(encoding="utf-8", errors="replace"))
                  for f in sorted(Path(".").glob("Makefile*"))
                  if f.is_file()
              )


          def export_presets():
              found, current = [], None
              cfg_file = Path("export_presets.cfg")
              if not cfg_file.is_file():
                  return found
              for line in cfg_file.read_text(encoding="utf-8").splitlines():
                  line = line.strip()
                  section = re.fullmatch(r"\[(.+)\]", line)
                  if section:
                      current = {} if re.fullmatch(r"preset\.\d+", section.group(1)) else None
                      if current is not None:
                          found.append(current)
                      continue
                  pair = re.fullmatch(r'(name|export_path)="(.*)"', line)
                  if current is not None and pair:
                      current[pair.group(1)] = pair.group(2)
              return [p for p in found if p.get("name") and p.get("export_path")]


          def default_archive(name):
              return "tar.gz" if "linux" in name.lower() else "zip"


          from_file = {p["name"]: p["export_path"] for p in export_presets()}
          raw = cfg.get("presets")
          if raw is None:
              raw = [{"preset": name} for name in from_file]
          if not isinstance(raw, list) or not all(isinstance(e, dict) for e in raw):
              fail("[release] presets must be a list of [[release.presets]] tables.")
          presets, slugs = [], set()
          for entry in raw:
              preset = entry.get("preset")
              if not isinstance(preset, str) or not preset:
                  fail("each [[release.presets]] table needs a `preset` string.")
              output = entry.get("output") or from_file.get(preset)
              if not isinstance(output, str) or not output:
                  fail(f"preset '{preset}' has no output: set it, or give it an export_path in export_presets.cfg.")
              archive = entry.get("archive", default_archive(preset))
              if archive not in ("zip", "tar.gz"):
                  fail(f"preset '{preset}': archive must be \"zip\" or \"tar.gz\", not {archive!r}.")
              if os.path.dirname(output.rstrip("/")) in ("", "."):
                  fail(f"preset '{preset}': output '{output}' must sit in its own directory; the archive holds that directory.")
              slug = re.sub(r"[^a-z0-9]+", "-", preset.lower()).strip("-")
              if slug in slugs:
                  fail(f"two presets give the asset name '{slug}'.")
              slugs.add(slug)
              presets.append({"name": entry.get("name", preset), "preset": preset,
                              "output": output, "archive": archive})
          if not presets:
              fail("no export presets: export_presets.cfg has none with a name and an export_path, and [release] presets is empty.")

          def gate_entry(entry):
              if isinstance(entry, list) and entry and all(isinstance(g, str) for g in entry):
                  entry = " ".join(entry)
              if not isinstance(entry, str) or not entry.strip():
                  fail("each [release] gate entry must be a non-empty string or a list of strings.")
              return entry.strip()


          gate = cfg.get("gate")
          if gate is None:
              gates = [t for t in ("verify", "milestone") if has_target(t)][:1]
          elif isinstance(gate, str):
              gates = [gate_entry(gate)] if gate.strip() else []
          elif isinstance(gate, list):
              gates = [gate_entry(e) for e in gate]
          else:
              fail("[release] gate must be a string or a list of entries.")

          gate_timeout = cfg.get("gate_timeout", 30)
          if not isinstance(gate_timeout, int) or isinstance(gate_timeout, bool) or gate_timeout <= 0:
              fail("[release] gate_timeout must be a positive integer (minutes).")

          version_file = text("version_file")
          version_placeholder = text("version_placeholder")
          if bool(version_file) != bool(version_placeholder):
              fail("[release] version_file and version_placeholder go together: set both or neither.")

          patch = cfg.get("godot_patch")
          patch = str(patch) if isinstance(patch, int) and not isinstance(patch, bool) else patch
          if not isinstance(patch, str) or not patch.isdigit():
              fail("set godot_patch (the engine patch number, e.g. \"2\") in the [release] section of godot-devkit.toml.")
          project = Path("project.godot")
          features = ""
          if project.is_file():
              match = re.search(r"^config/features=PackedStringArray\((.*)\)\s*$",
                                project.read_text(encoding="utf-8"), re.M)
              features = match.group(1) if match else ""
          engine = re.search(r'"(\d+\.\d+)"', features)
          if not engine:
              fail("project.godot config/features holds no MAJOR.MINOR engine entry.")

          title = text("title") or os.environ.get("GITHUB_REPOSITORY", "/release").split("/")[1]
          outputs = {
              "presets": json.dumps(presets),
              "gates": json.dumps(gates),
              "gate_timeout": str(gate_timeout),
              "before_export": json.dumps(strings("before_export")),
              "version_file": version_file,
              "version_placeholder": version_placeholder,
              "title": title,
              "godot_patch": patch,
              "godot_version": f"{engine.group(1)}.{patch}",
          }
          target = os.environ.get("GITHUB_OUTPUT")
          lines = "".join(f"{k}={v}\n" for k, v in outputs.items())
          if target:
              with open(target, "a", encoding="utf-8") as out:
                  out.write(lines)
          print(lines, end="")
          PY

  gate:
    name: gate (${{ matrix.gate }})
    needs: config
    if: needs.config.outputs.gates != '[]'
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: ${{ fromJSON(needs.config.outputs.gate_timeout) }}
    strategy:
      # Any red entry stops the others, and so the release.
      fail-fast: true
      matrix:
        gate: ${{ fromJSON(needs.config.outputs.gates) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.config.outputs.sha }}
      - uses: astral-sh/setup-uv@v5
      - uses: ./.github/actions/godot-toolchain
        with:
          godot-patch: ${{ needs.config.outputs.godot_patch }}
      - name: Run the gate
        env:
          GATE: ${{ matrix.gate }}
        # An entry may name several targets and make variables, so $GATE is
        # split on purpose (word splitting, no eval).
        run: make $GATE

  export:
    name: Export ${{ matrix.name }}
    needs: [config, gate]
    # A gate matrix skipped by design (no gates) does not stop the export;
    # when it ran, every entry must have succeeded.
    if: always() && needs.config.result == 'success' && (needs.gate.result == 'success' || needs.gate.result == 'skipped')
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.config.outputs.presets) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.config.outputs.sha }}
      - name: Inject the version
        if: needs.config.outputs.version_file != ''
        env:
          TAG: ${{ needs.config.outputs.tag }}
          VERSION_FILE: ${{ needs.config.outputs.version_file }}
          PLACEHOLDER: ${{ needs.config.outputs.version_placeholder }}
        run: |
          python3 - <<'PY'
          import os
          import sys
          from pathlib import Path

          path = Path(os.environ["VERSION_FILE"])
          placeholder = os.environ["PLACEHOLDER"]
          version = os.environ["TAG"][1:]
          body = path.read_text(encoding="utf-8")
          if placeholder not in body:
              print(f"::error::{path} does not hold the placeholder '{placeholder}'.")
              sys.exit(1)
          path.write_text(body.replace(placeholder, version), encoding="utf-8")
          print(f"Injected version {version} into {path}.")
          PY
      # The export needs the export templates, which the toolchain action does
      # not install and a runner image does not carry. setup-godot sets GODOT.
      - uses: chickensoft-games/setup-godot@v2
        with:
          version: ${{ needs.config.outputs.godot_version }}
          include-templates: true
          use-dotnet: false
      - name: Before export
        if: needs.config.outputs.before_export != '[]'
        env:
          BEFORE_EXPORT: ${{ needs.config.outputs.before_export }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import subprocess

          for command in json.loads(os.environ["BEFORE_EXPORT"]):
              print(f"+ {command}", flush=True)
              subprocess.run(["bash", "-e", "-c", command], check=True)
          PY
      - name: Import the project
        run: '"$GODOT" --headless --import || true'
      - name: Export ${{ matrix.preset }}
        env:
          PRESET: ${{ matrix.preset }}
          OUTPUT: ${{ matrix.output }}
        run: |
          set -eu
          mkdir -p "$(dirname "$OUTPUT")"
          "$GODOT" --headless --export-release "$PRESET" "$OUTPUT"
          test -e "$OUTPUT" || { echo "::error::The export of '$PRESET' wrote nothing at $OUTPUT." >&2; exit 1; }
      - name: Package
        id: package
        env:
          PRESET: ${{ matrix.preset }}
          OUTPUT: ${{ matrix.output }}
          ARCHIVE: ${{ matrix.archive }}
        run: |
          set -eu
          slug=$(printf '%s' "$PRESET" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9][^a-z0-9]*/-/g; s/^-//; s/-$//')
          name="${GITHUB_REPOSITORY#*/}-$slug"
          file="$RUNNER_TEMP/$name.$ARCHIVE"
          stage="$RUNNER_TEMP/stage-$slug"
          rm -rf "$stage"
          mkdir -p "$stage/$name"
          cp -a "$(dirname "$OUTPUT")/." "$stage/$name/"
          case "$ARCHIVE" in
            zip)
              if ! command -v zip >/dev/null 2>&1; then
                sudo apt-get update -qq
                sudo apt-get install -y --no-install-recommends zip
              fi
              (cd "$stage" && zip -qr "$file" "$name")
              ;;
            *)
              tar -czf "$file" -C "$stage" "$name"
              ;;
          esac
          ls -lh "$file"
          echo "slug=$slug" >> "$GITHUB_OUTPUT"
          echo "file=$file" >> "$GITHUB_OUTPUT"
      # Nothing is published here: the release job does that once every export
      # is green. The artifact is the hand-over; 1 day is all it needs.
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ steps.package.outputs.slug }}
          path: ${{ steps.package.outputs.file }}
          retention-days: 1
          if-no-files-found: error

  release:
    name: Create the Release
    needs: [config, gate, export]
    # The export matrix must be green. A gate matrix skipped by design (no
    # gates) does not stop the release; when it ran, every entry must have
    # succeeded.
    if: always() && needs.config.result == 'success' && (needs.gate.result == 'success' || needs.gate.result == 'skipped') && needs.export.result == 'success'
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: ${{ runner.temp }}/assets
      - name: Create or update the Release
        env:
          TAG: ${{ needs.config.outputs.tag }}
          SHA: ${{ needs.config.outputs.sha }}
          TITLE: ${{ needs.config.outputs.title }}
        run: |
          set -eu
          # The tag is created last, here. If it already exists at another
          # commit, stop before anything is created or changed.
          if existing=$(gh api "repos/$GITHUB_REPOSITORY/commits/refs/tags/$TAG" --jq .sha 2>/dev/null); then
            if [ "$existing" != "$SHA" ]; then
              echo "::error::The tag $TAG already exists at $existing, not at $SHA. Nothing was created. Pick a new tag, or release $existing."
              exit 1
            fi
            echo "The tag $TAG already exists at $SHA."
          fi
          # The pull request that merged the commit; its `Release notes`
          # section is the body. No pull request, or no section, falls back to
          # the generated list.
          pr_body=$(gh api "repos/$GITHUB_REPOSITORY/commits/$SHA/pulls" \
            --jq '[.[] | select((.body // "") | test("(^|\n)#{2,3} Release notes"))] | .[0].body // ""' || true)
          section=$(printf '%s\n' "$pr_body" | tr -d '\r' | awk '
            /^##+ Release notes[[:space:]]*$/ { on = 1; next }
            on && /^##?#?[[:space:]]/ { exit }
            on && /^🤖/ { exit }
            on && !started && /^[[:space:]]*$/ { next }
            on { started = 1; print }')
          notes="$RUNNER_TEMP/release-notes.md"
          if [ -n "$(printf '%s' "$section" | tr -d '[:space:]')" ]; then
            printf '%s\n' "$section" > "$notes"
            echo "Release notes: the Release notes section of the merging pull request."
          else
            : > "$notes"
            echo "Release notes: no section found; using generated notes."
          fi
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG exists: updating it."
            if [ -s "$notes" ]; then
              gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --title "$TITLE $TAG" --notes-file "$notes"
            else
              gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --title "$TITLE $TAG"
            fi
          elif [ -s "$notes" ]; then
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$SHA" --title "$TITLE $TAG" --notes-file "$notes"
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$SHA" --title "$TITLE $TAG" --generate-notes
          fi
          ls -l "$RUNNER_TEMP/assets"
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber "$RUNNER_TEMP"/assets/*
