# GENERATED by godot-devkit — `godot-devkit install-ci`.
#
# On a push to the mainline, read `config/version` out of project.godot and tag
# it (`v0.62.0`). Idempotent: an existing tag is a skip, not a failure, so a
# docs-only follow-up push cannot redden the run.
#
# THE DISPATCH IS EXPLICIT AND CONDITIONAL. A tag pushed with the default
# GITHUB_TOKEN does NOT trigger downstream workflows (GitHub's recursion
# guard), so the release build has to be dispatched by name. That name is
# RELEASE_WORKFLOW below — the one project-specific string in this file, and a
# variable rather than a hard-coded assumption. A project that has no release
# pipeline yet leaves it and gets a green "tagged only" step: the workflow is
# looked for on disk, and its absence is a documented outcome rather than a red
# X somebody has to learn to ignore. The dispatched workflow is called with
# `-f tag=<tag>`, so it wants a `tag` input.
#
# After this file is written it is YOURS. Edit it here; re-installing needs
# --force, and `--diff` shows what a re-install would change.
name: Auto-Tag Release

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**.md"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  tag:
    name: Create version tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract version
        id: version
        run: |
          VERSION=$(grep 'config/version=' project.godot | sed 's/config\/version="//' | sed 's/"//')
          if [ -z "$VERSION" ]; then
            echo "::error::Could not read config/version from project.godot"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Detected version: $VERSION"

      - name: Check if the tag exists
        id: check
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          TAG="v$VERSION"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Tag $TAG already exists — skipping"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "Tag $TAG does not exist — will create"
          fi

      - name: Create and push the tag
        if: steps.check.outputs.exists == 'false'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          TAG="v$VERSION"
          git tag "$TAG"
          git push origin "$TAG"
          echo "Created and pushed tag: $TAG"

      - name: Dispatch the release build
        if: steps.check.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
          # Your release pipeline. Absent = this step is a no-op, by design.
          RELEASE_WORKFLOW: release.yml
        run: |
          if [ ! -f ".github/workflows/$RELEASE_WORKFLOW" ]; then
            echo "No .github/workflows/$RELEASE_WORKFLOW — tagged only, nothing dispatched."
            exit 0
          fi
          TAG="v$VERSION"
          gh workflow run "$RELEASE_WORKFLOW" --ref "$TAG" -f tag="$TAG"
          echo "Dispatched $RELEASE_WORKFLOW at $TAG"
