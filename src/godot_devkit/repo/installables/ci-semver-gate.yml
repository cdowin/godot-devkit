# GENERATED by godot-devkit — `godot-devkit install-ci`.
#
# Every merge to the mainline bumps the version, on purpose. This reads
# `config/version` out of project.godot on the PR branch and on main, and
# blocks the merge unless the PR's is strictly greater.
#
# VERSIONS OF ANY LENGTH compare component-wise: a missing component defaults
# to 0, so `0.16` -> `0.16.1` is the bump it is, and a fourth component (a
# hotfix `0.90.3` -> `0.90.3.1`, a sub-milestone `0.90.4.1`) is compared, not
# dropped. A non-numeric component is refused rather than crashing the test.
#
# The FIRST versioned merge is allowed with a warning: main having no
# config/version yet is a one-time state, and failing it would mean no first
# merge could ever land.
#
# After this file is written it is YOURS. Edit it here; re-installing needs
# --force, and `--diff` shows what a re-install would change.
name: Semver Gate

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check-version:
    name: Version must increase
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract versions
        id: versions
        run: |
          PR_VERSION=$(grep 'config/version=' project.godot | sed 's/config\/version="//' | sed 's/"//')
          git fetch origin main
          MAIN_VERSION=$(git show origin/main:project.godot | grep 'config/version=' | sed 's/config\/version="//' | sed 's/"//')
          echo "pr_version=$PR_VERSION" >> "$GITHUB_OUTPUT"
          echo "main_version=$MAIN_VERSION" >> "$GITHUB_OUTPUT"
          echo "PR version: $PR_VERSION"
          echo "Main version: $MAIN_VERSION"

      - name: Compare versions
        env:
          PR: ${{ steps.versions.outputs.pr_version }}
          MAIN: ${{ steps.versions.outputs.main_version }}
        run: |
          if [ -z "$PR" ]; then
            echo "::error::Could not read config/version from project.godot on the PR branch"
            exit 1
          fi

          if [ -z "$MAIN" ]; then
            echo "::warning::No config/version on main yet — first versioned merge. Allowing."
            exit 0
          fi

          # Compare component-wise, ANY length; a missing component is 0, so a
          # two-part version compares numerically, and a fourth part (a hotfix
          # 0.90.3 -> 0.90.3.1, a sub-milestone id 0.90.4.1) is compared rather
          # than dropped on the floor. A non-numeric component refuses: a
          # letter suffix would otherwise error this gate on every later PR.
          IFS='.' read -r -a PR_PARTS <<< "$PR"
          IFS='.' read -r -a MAIN_PARTS <<< "$MAIN"
          n=${#PR_PARTS[@]}; [ "${#MAIN_PARTS[@]}" -gt "$n" ] && n=${#MAIN_PARTS[@]}
          verdict=equal
          for ((i = 0; i < n; i++)); do
            p="${PR_PARTS[i]:-0}"; m="${MAIN_PARTS[i]:-0}"
            case "$p$m" in *[!0-9]*)
              echo "::error::Non-numeric version component — main is '$MAIN', PR is '$PR'. Versions are dotted integers only."
              exit 1;;
            esac
            if [ "$p" -gt "$m" ]; then verdict=greater; break
            elif [ "$p" -lt "$m" ]; then verdict=less; break; fi
          done
          if [ "$verdict" = greater ]; then
            echo "Version bump OK: $MAIN -> $PR"
          else
            echo "::error::Version must increase. Main is $MAIN, PR is $PR. Bump config/version in project.godot before merging."
            exit 1
          fi
