# GENERATED by godot-devkit — `godot-devkit install-ci`.
#
# The can't-skip half of the committed-.uid policy. `make uid-scan` is
# `godot-devkit check uid` at the tag your Makefile pins: a .tres/.tscn script
# ref whose uid drifted from the script's own .gd.uid, a tracked .gd with no
# tracked .uid, a non-canonical uid spelling. Pure parse + git — NO Godot
# setup, so it is seconds, and it is independent of any build job.
#
# It runs on the two moments a local `make precommit` can be skipped: a PR into
# the mainline, and a push to the integration branch. The branch names below
# are the flow this toolkit's SDLC declares (staging -> main, merge-commit
# only); `on:` filters take no expressions, so they are literals rather than
# variables.
#
# NOT here: `check tres`. It is in the default `check all` roster, which
# verify.yml runs on the same events — a second copy would be a second answer.
#
# After this file is written it is YOURS. Edit it here; re-installing needs
# --force, and `--diff` shows what a re-install would change.
name: UID Guard

on:
  pull_request:
    branches: [main]
  push:
    branches: [staging]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  uid-scan:
    name: .uid drift guard
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # The gate resolves its scope through `git ls-files` and reads the
          # tracked .uid set. A shallow checkout answers that wrongly.
          fetch-depth: 0
      - name: Install uv (runs the pinned godot-devkit gate)
        uses: astral-sh/setup-uv@v5
      - name: make uid-scan
        run: make uid-scan
