# GENERATED by godot-devkit {version} — `godot-devkit install-ci`.
#
# The skeleton is devkit's; everything specific to this repo comes from
# devkit.toml, never from an edit here. An edited copy still LOOKS installed,
# which is the fork-by-copy this verb exists to prevent — change the config and
# re-install instead.
#
# The job runs ONE command. What that executes is this project's `verify` role:
#
#     [tasks]
#     verify = "..."      # your own full gate
#
# so CI cannot drift from the local gate — they are the same target, named once.
#
# What the gate needs BEFORE it can run is also the project's, because nothing
# generic can know it. Both game consumers need a Godot toolchain, which no
# skeleton can provision for them:
#
#     [ci]
#     on = ["push", "pull_request", "workflow_dispatch"]
#     branches = ["main"]          # push + pull_request; ["**"] for every branch
#
#     [[ci.setup]]                 # after checkout + uv, before the gate
#     name = "Setup Godot"
#     uses = "chickensoft-games/setup-godot@v2"
#     with = { version = "4.6.2", include-templates = false }
name: verify

on:
{ci_on}

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The PM gates read `git worktree list` and branch placement, and the
          # doc gates read tracked files. A shallow checkout answers both
          # wrongly.
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
{ci_setup}
      - name: godot-devkit task verify
        run: uvx --from "$DEVKIT" godot-devkit task verify
        env:
          DEVKIT: {devkit_source}
